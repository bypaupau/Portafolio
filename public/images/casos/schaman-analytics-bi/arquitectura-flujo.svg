<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 490" role="img" aria-labelledby="title desc">
  <title id="title">Flujo de datos de Schaman Analytics BI</title>
  <desc id="desc">Registros de una base OLTP pasan por Pentaho PDI, se organizan en un Data Warehouse en Supabase, se consultan con funciones SQL y se presentan en un dashboard de React.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#d56f98"/>
    </marker>
  </defs>
  <rect width="1400" height="490" rx="24" fill="#fff7fa"/>
  <g font-family="Outfit,Arial,sans-serif" fill="#2c1a24">
    <g stroke="#e4d4dc" stroke-width="2">
      <rect x="30" y="78" width="236" height="296" rx="18" fill="#f8e3eb"/>
      <rect x="306" y="78" width="236" height="296" rx="18" fill="#dff0fb"/>
      <rect x="582" y="78" width="236" height="296" rx="18" fill="#fff0bd"/>
      <rect x="858" y="78" width="236" height="296" rx="18" fill="#e6effb"/>
      <rect x="1134" y="78" width="236" height="296" rx="18" fill="#f7e4eb"/>
    </g>
    <g fill="none" stroke="#d56f98" stroke-width="4" marker-end="url(#arrow)">
      <path d="M270 216h30"/><path d="M546 216h30"/><path d="M822 216h30"/><path d="M1098 216h30"/>
    </g>
    <g fill="#9b4f70" font-size="16" font-weight="700" letter-spacing=".5">
      <text x="50" y="120">01 · ORIGEN</text>
      <text x="326" y="120">02 · TRANSFORMACIÓN</text>
      <text x="602" y="120">03 · ALMACÉN</text>
      <text x="878" y="120">04 · CONSULTA</text>
      <text x="1154" y="120">05 · INTERFAZ</text>
    </g>
    <g font-size="23" font-weight="700">
      <text x="50" y="172">Base OLTP</text>
      <text x="326" y="172">Pentaho PDI</text>
      <text x="602" y="172">Supabase DW</text>
      <text x="878" y="172">Funciones SQL</text>
      <text x="1154" y="172">Dashboard</text>
    </g>
    <g fill="#4e625e" font-size="17">
      <text x="50" y="218"><tspan x="50">Sesiones y</tspan><tspan x="50" dy="27">catálogos</tspan><tspan x="50" dy="27">operativos</tspan></text>
      <text x="326" y="218"><tspan x="326">Extracción, limpieza,</tspan><tspan x="326" dy="27">transformación y</tspan><tspan x="326" dy="27">carga (ETL)</tspan></text>
      <text x="602" y="218"><tspan x="602">Un hecho por sesión</tspan><tspan x="602" dy="27">y dimensiones para</tspan><tspan x="602" dy="27">el análisis</tspan></text>
      <text x="878" y="218"><tspan x="878">Cálculos y filtros</tspan><tspan x="878" dy="27">expuestos a la app</tspan><tspan x="878" dy="27">mediante RPC</tspan></text>
      <text x="1154" y="218"><tspan x="1154">React, Vite y</tspan><tspan x="1154" dy="27">Recharts: filtros,</tspan><tspan x="1154" dy="27">KPI y gráficos</tspan></text>
    </g>
    <text x="34" y="438" fill="#7a4a61" font-size="17" font-weight="600">Flujo descrito en la entrega académica · La carga histórica desde CSV se documenta como ficticia.</text>
  </g>
</svg>
