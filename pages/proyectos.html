=\"5\" height=\"1\" fill=\"#2C1A24\"/><rect x=\"2\" y=\"8\" width=\"1\" height=\"1\" fill=\"#2C1A24\"/><rect x=\"3\" y=\"8\" width=\"3\" height=\"1\" fill=\"#F4C04E\"/><rect x=\"6\" y=\"8\" width=\"1\" height=\"1\" fill=\"#2C1A24\"/><rect x=\"2\" y=\"9\" width=\"5\" height=\"1\" fill=\"#2C1A24\"/></svg>", "s-pink": "<svg class=\"px\" style=\"--gw:9;--gh:10\" viewBox=\"0 0 9 10\" shape-rendering=\"crispEdges\" aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"1\" y=\"0\" width=\"2\" height=\"1\" fill=\"#E87EA1\"/><rect x=\"6\" y=\"0\" width=\"2\" height=\"1\" fill=\"#D6EEFB\"/><rect x=\"1\" y=\"1\" width=\"2\" height=\"1\" fill=\"#E87EA1\"/><rect x=\"6\" y=\"1\" width=\"2\" height=\"1\" fill=\"#D6EEFB\"/><rect x=\"2\" y=\"2\" width=\"2\" height=\"1\" fill=\"#E87EA1\"/><rect x=\"5\" y=\"2\" width=\"2\" height=\"1\" fill=\"#D6EEFB\"/><rect x=\"3\" y=\"3\" width=\"3\" height=\"1\" fill=\"#2C1A24\"/><rect x=\"2\" y=\"4\" width=\"1\" height=\"1\" fill=\"#2C1A24\"/><rect x=\"3\" y=\"4\" width=\"3\" height=\"1\" fill=\"#F4C04E\"/><rect x=\"6\" y=\"4\" width=\"1\" height=\"1\" fill=\"#2C1A24\"/><rect x=\"1\" y=\"5\" width=\"1\" height=\"1\" fill=\"#2C1A24\"/><rect x=\"2\" y=\"5\" width=\"2\" height=\"1\" fill=\"#F4C04E\"/><rect x=\"4\" y=\"5\" width=\"1\" height=\"1\" fill=\"#2C1A24\"/><rect x=\"5\" y=\"5\" width=\"2\" height=\"1\" fill=\"#F4C04E\"/><rect x=\"7\" y=\"5\" width=\"1\" height=\"1\" fill=\"#2C1A24\"/><rect x=\"1\" y=\"6\" width=\"1\" height=\"1\" fill=\"#2C1A24\"/><rect x=\"2\" y=\"6\" width=\"1\" height=\"1\" fill=\"#F4C04E\"/><rect x=\"3\" y=\"6\" width=\"3\" height=\"1\" fill=\"#2C1A24\"/><rect x=\"6\" y=\"6\" width=\"1\" height=\"1\" fill=\"#F4C04E\"/><rect x=\"7\" y=\"6\" width=\"1\" height=\"1\" fill=\"#2C1A24\"/><rect x=\"1\" y=\"7\" width=\"1\" height=\"1\" fill=\"#2C1A24\"/><rect x=\"2\" y=\"7\" width=\"2\" height=\"1\" fill=\"#F4C04E\"/><rect x=\"4\" y=\"7\" width=\"1\" height=\"1\" fill=\"#2C1A24\"/><rect x=\"5\" y=\"7\" width=\"2\" height=\"1\" fill=\"#F4C04E\"/><rect x=\"7\" y=\"7\" width=\"1\" height=\"1\" fill=\"#2C1A24\"/><rect x=\"2\" y=\"8\" width=\"1\" height=\"1\" fill=\"#2C1A24\"/><rect x=\"3\" y=\"8\" width=\"3\" height=\"1\" fill=\"#F4C04E\"/><rect x=\"6\" y=\"8\" width=\"1\" height=\"1\" fill=\"#2C1A24\"/><rect x=\"3\" y=\"9\" width=\"3\" height=\"1\" fill=\"#2C1A24\"/></svg>", "s-lav": "<svg class=\"px\" style=\"--gw:9;--gh:9\" viewBox=\"0 0 9 9\" shape-rendering=\"crispEdges\" aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"1\" height=\"1\" fill=\"#2C1A24\"/><rect x=\"6\" y=\"0\" width=\"1\" height=\"1\" fill=\"#2C1A24\"/><rect x=\"0\" y=\"1\" width=\"2\" height=\"1\" fill=\"#2C1A24\"/><rect x=\"5\" y=\"1\" width=\"2\" height=\"1\" fill=\"#2C1A24\"/><rect x=\"0\" y=\"2\" width=\"1\" height=\"1\" fill=\"#2C1A24\"/><rect x=\"1\" y=\"2\" width=\"1\" height=\"1\" fill=\"#E6D8FB\"/><rect x=\"2\" y=\"2\" width=\"3\" height=\"1\" fill=\"#2C1A24\"/><rect x=\"5\" y=\"2\" width=\"1\" height=\"1\" fill=\"#E6D8FB\"/><rect x=\"6\" y=\"2\" width=\"1\" height=\"1\" fill=\"#2C1A24\"/><rect x=\"0\" y=\"3\" width=\"1\" height=\"1\" fill=\"#2C1A24\"/><rect x=\"1\" y=\"3\" width=\"5\" height=\"1\" fill=\"#E6D8FB\"/><rect x=\"6\" y=\"3\" width=\"1\" height=\"1\" fill=\"#2C1A24\"/><rect x=\"0\" y=\"4\" width=\"1\" height=\"1\" fill=\"#2C1A24\"/><rect x=\"1\" y=\"4\" width=\"1\" height=\"1\" fill=\"#E6D8FB\"/><rect x=\"2\" y=\"4\" width=\"1\" height=\"1\" fill=\"#2C1A24\"/><rect x=\"3\" y=\"4\" width=\"1\" height=\"1\" fill=\"#E6D8FB\"/><rect x=\"4\" y=\"4\" width=\"1\" height=\"1\" fill=\"#2C1A24\"/><rect x=\"5\" y=\"4\" width=\"1\" height=\"1\" fill=\"#E6D8FB\"/><rect x=\"6\" y=\"4\" width=\"1\" height=\"1\" fill=\"#2C1A24\"/><rect x=\"0\" y=\"5\" width=\"1\" height=\"1\" fill=\"#2C1A24\"/><rect x=\"1\" y=\"5\" width=\"2\" height=\"1\" fill=\"#E6D8FB\"/><rect x=\"3\" y=\"5\" width=\"1\" height=\"1\" fill=\"#E87EA1\"/><rect x=\"4\" y=\"5\" width=\"2\" height=\"1\" fill=\"#E6D8FB\"/><rect x=\"6\" y=\"5\" width=\"2\" height=\"1\" fill=\"#2C1A24\"/><rect x=\"1\" y=\"6\" width=\"1\" height=\"1\" fill=\"#2C1A24\"/><rect x=\"2\" y=\"6\" width=\"4\" height=\"1\" fill=\"#E6D8FB\"/><rect x=\"6\" y=\"6\" width=\"1\" height=\"1\" fill=\"#2C1A24\"/><rect x=\"8\" y=\"6\" width=\"1\" height=\"1\" fill=\"#2C1A24\"/><rect x=\"1\" y=\"7\" width=\"1\" height=\"1\" fill=\"#2C1A24\"/><rect x=\"2\" y=\"7\" width=\"4\" height=\"1\" fill=\"#E6D8FB\"/><rect x=\"6\" y=\"7\" width=\"1\" height=\"1\" fill=\"#2C1A24\"/><rect x=\"8\" y=\"7\" width=\"1\" height=\"1\" fill=\"#2C1A24\"/><rect x=\"1\" y=\"8\" width=\"1\" height=\"1\" fill=\"#2C1A24\"/><rect x=\"2\" y=\"8\" width=\"1\" height=\"1\" fill=\"#E6D8FB\"/><rect x=\"3\" y=\"8\" width=\"1\" height=\"1\" fill=\"#2C1A24\"/><rect x=\"4\" y=\"8\" width=\"1\" height=\"1\" fill=\"#E6D8FB\"/><rect x=\"5\" y=\"8\" width=\"3\" height=\"1\" fill=\"#2C1A24\"/></svg>"};

  var $ = function (id) { return document.getElementById(id); };
  var boxD = $('chips-d'), featGrid = $('feat-grid'), archList = $('arch-list');

  function esc(v) { return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  /* "academico, personal" → ['universidad','personal'] */
  function ctxOf(p) {
    return String(p.tipo || '').split(',').map(function (s) {
      s = s.trim().toLowerCase(); return s === 'academico' ? 'universidad' : s;
    }).filter(Boolean);
  }
  function match(p, d, c) {
    return (!d || (p.disciplinas || []).indexOf(d) >= 0) && (!c || ctxOf(p).indexOf(c) >= 0);
  }
  function imgOf(p) { return p.img ? (/^(https?:|\/|\.\.\/)/.test(p.img) ? p.img : '../' + p.img) : ''; }
  function hrefOf(p) { var h = p.enlace || p.repo; return (h && h !== '#') ? h : ''; }
  function pills(p, n) {
    return (p.habilidades || []).slice(0, n).map(function (s) { return '<span class="pill">' + esc(pick(s)) + '</span>'; }).join('');
  }

  /* estado inicial: ?disciplina=datos&contexto=universidad */
  var q = new URLSearchParams(location.search);
  var state = {
    d: DISC.indexOf(q.get('disciplina')) >= 0 ? q.get('disciplina') : '',
    c: ''   /* el contexto ya no es un filtro: se lee en la metadata de cada proyecto */
  };

  var feat = PROYECTOS.filter(function (p) { return p.destacado; })
                      .sort(function (a, b) { return a.destacado - b.destacado; });
  var arch = PROYECTOS.filter(function (p) { return !p.destacado; })
                      .sort(function (a, b) { return String(b.fecha || '').localeCompare(String(a.fecha || '')); });

  /* tarjeta grande: el mismo componente del inicio, pero con la descripción visible */
  function featCard(p) {
    var h = hrefOf(p), tag = h ? 'a' : 'div';
    var attrs = h ? ' href="' + esc(h) + '" target="_blank" rel="noopener"' : '';
    return '<' + tag + ' class="pcard pcard-full"' + attrs + '>' +
      (p.logro ? '<span class="pcard-sticker ' + esc(p.sello || 's-pink') + '">' + (SEAL[p.sello] || '') + '<span>' + esc(pick(p.logro)) + '</span></span>' : '') +
      '<span class="win pcard-win"><span class="win-bar ' + (BAR[p.color] || '') + '"><span class="win-title">' + esc(pick(p.archivo || p.nombre)) + '</span>' +
        '<span class="win-ctrls" aria-hidden="true"><i>_</i><i>▢</i><i>✕</i></span></span>' +
        '<span class="pcard-media">' + (p.img ? '<img src="' + esc(imgOf(p)) + '" alt="" loading="lazy" decoding="async">' : '') + '</span></span>' +
      '<span class="pcard-info">' +
        '<span class="pcard-title">' + esc(pick(p.nombreCorto || p.nombre)) + '</span>' +
        '<span class="pcard-meta">' + esc(pick(p.meta || p.periodo)) + '</span>' +
        '<span class="pcard-desc">' + esc(pick(p.descripcion)) + '</span>' +
        '<span class="pcard-tools">' + pills(p, 4) + '</span>' +
        (h ? '<span class="pcard-cta">' + esc(t('projects.view')) + ' <span class="pcard-arr" aria-hidden="true">↗</span></span>' : '') +
      '</span></' + tag + '>';
  }

  /* fila del archivo: miniatura | nombre + descripción + contexto | enlace */
  function archRow(p) {
    var h = hrefOf(p), tag = h ? 'a' : 'div';
    var attrs = h ? ' href="' + esc(h) + '" target="_blank" rel="noopener"' : '';
    var est = String(p.estado || '').trim().toLowerCase();
    var mat = pick(p.materia);
    var meta = ctxOf(p).map(function (c) { return t('projects.c.' + c); }).join(' + ');
    if (mat && mat !== '-') meta += ' · ' + mat;
    if (p.periodo) meta += ' · ' + pick(p.periodo);
    var go = h ? (p.enlaceTxt ? pick(p.enlaceTxt) : t('projects.repo')) : t('projects.soon');
    return '<li><' + tag + ' class="arow"' + attrs + '>' +
      '<span class="arow-thumb">' + (p.img ? '<img src="' + esc(imgOf(p)) + '" alt="" loading="lazy" decoding="async">' : '') + '</span>' +
      '<span class="arow-main">' +
        '<span class="arow-name">' + esc(pick(p.nombre)) +
          (est === 'en-progreso' ? ' <span class="badge bd-wip">' + esc(t('badge.en-progreso')) + '</span>' : '') + '</span>' +
        '<span class="arow-desc">' + esc(pick(p.descripcion)) + '</span>' +
        '<span class="arow-meta">' + esc(meta) + '</span>' +
        '<span class="arow-tools">' + pills(p, 3) + '</span>' +
      '</span>' +
      '<span class="arow-go">' + esc(go) + '</span>' +
    '</' + tag + '></li>';
  }

  function count(d, c) { return PROYECTOS.filter(function (p) { return match(p, d, c); }).length; }
  /* sin número en cada botón: una opción sin resultados solo se atenúa (data-zero) */
  function btn(kind, val, label, on) {
    var n = (kind === 'd') ? count(val, state.c) : count(state.d, val);
    return '<button type="button" class="chip' + (on ? ' is-on' : '') + '" data-kind="' + kind + '" data-val="' + val + '" aria-pressed="' + on + '"' +
           (n === 0 && !on ? ' data-zero' : '') + '>' + esc(label) + '</button>';
  }
  function renderChips() {
    boxD.innerHTML = btn('d', '', t('projects.f.all').toLowerCase(), !state.d) +
      DISC.map(function (d) { return btn('d', d, t('projects.d.' + d).toLowerCase(), state.d === d); }).join('');
    var n = count(state.d, state.c), tot = PROYECTOS.length;
    $('fx-count').innerHTML = (n === tot ? t('projects.count.all') : t('projects.count.some'))
      .replace('{n}', '<b>' + n + '</b>').replace('{t}', tot);
    /* celular: las pestañas se deslizan; la elegida siempre a la vista */
    var on = boxD.querySelector('.is-on');
    if (on && boxD.scrollWidth > boxD.clientWidth) boxD.scrollLeft = Math.max(0, on.offsetLeft - 24);
  }

  function render() {
    renderChips();
    var f = feat.filter(function (p) { return match(p, state.d, state.c); });
    var a = arch.filter(function (p) { return match(p, state.d, state.c); });
    featGrid.innerHTML = f.map(featCard).join('');
    archList.innerHTML = a.map(archRow).join('');
    /* transición corta al cambiar el filtro */
    featGrid.classList.remove('fx-swap'); archList.classList.remove('fx-swap'); void featGrid.offsetWidth;
    featGrid.classList.add('fx-swap'); archList.classList.add('fx-swap');
    $('sec-feat').hidden = !f.length;
    $('sec-arch').hidden = !a.length;
    $('arch-title').textContent = t('projects.arch.win').replace('{n}', a.length);
    var intro = $('proj-intro'), txt = t('projects.intro'); intro.textContent = txt; intro.hidden = !txt;
    var none = $('no-proj'); none.hidden = (f.length + a.length) > 0; none.textContent = t('projects.empty');
    $('proj-live').textContent = t('projects.live').replace('{n}', f.length + a.length);
  }

  document.querySelector('.chipbar').addEventListener('click', function (e) {
    var b = e.target.closest('.chip'); if (!b) return;
    state[b.getAttribute('data-kind')] = b.getAttribute('data-val');
    render();
    /* el foco se queda en el chip que se tocó (el HTML se vuelve a dibujar) */
    var again = document.querySelector('.chip[data-kind="' + b.getAttribute('data-kind') + '"][data-val="' + b.getAttribute('data-val') + '"]');
    if (again) again.focus();
    var qs = new URLSearchParams();
    if (state.d) qs.set('disciplina', state.d);
    try { history.replaceState(null, '', location.pathname + (qs.toString() ? '?' + qs : '')); } catch (err) {}
  });

  render();
  document.addEventListener('langchange', render);
})();
</script>
<script src="../js/portfolio.js?v=4"></script>
</body>
