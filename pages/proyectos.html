<p class="foot"><span data-i18n="foot.made">hecho con</span> <span class="hp">&lt;3</span> <span data-i18n="foot.rest">+ pixeles · por Pau · © 2026</span></p>

<!-- idioma (ES/EN) + taskbar: van primero para que todo lo demás ya salga traducido -->
<script src="../js/translations.js?v=1"></script>
<script src="../js/i18n.js?v=1"></script>

<script src="../data/proyectos.js?v=2"></script>
<script>
(function(){
  /* textos de la interfaz → js/translations.js · textos de cada proyecto → data/proyectos.js */
  var t = I18N.t, pick = I18N.pick;
  var BADGE_CSS = { 'completado':'bd-done', 'en-progreso':'bd-wip', 'pronto':'bd-soon' };
  var grid = document.getElementById('proyectos-grid');
  var fbox = document.getElementById('filtros');
  if(!grid || typeof PROYECTOS==='undefined') return;

  var barColors = ['', 'sky', 'lav', 'mint', 'peach'];

  /* valor estable para filtrar: el español (no cambia al cambiar de idioma) */
  function keyOf(v){ return (v && typeof v==='object') ? v.es : (v || ''); }

  /* Un proyecto puede tener varios tipos: tipo:"academico, personal".
     Además normalizamos a minúsculas para que "Academico" y "academico"
     no aparezcan como dos opciones distintas en el filtro. */
  function tiposDe(p){
    return String(p.tipo || '').split(',')
      .map(function(t){ return t.trim().toLowerCase(); })
      .filter(Boolean);
  }
  /* etiqueta traducida si existe; si no, el valor tal cual */
  function tr(key, fallback){ var v = t(key); return v === key ? fallback : v; }

  // construir conjuntos de filtros (value = clave estable · label = texto traducido)
  var materias=[], tipos=[], skills=[];
  PROYECTOS.forEach(function(p){
    if(p.materia && !materias.some(function(m){ return keyOf(m)===keyOf(p.materia); })) materias.push(p.materia);
    tiposDe(p).forEach(function(t){ if(tipos.indexOf(t)<0) tipos.push(t); });
    (p.habilidades||[]).forEach(function(s){
      if(!skills.some(function(k){ return keyOf(k)===keyOf(s); })) skills.push(s);
    });
  });

  function dd(id, labelKey, opts, val){
    var o = '<option value="">'+t('projects.f.all')+'</option>' + opts.map(function(v){
      return '<option value="'+v.val+'"'+(v.val===val?' selected':'')+'>'+v.txt+'</option>'; }).join('');
    return '<div class="dd"><label for="'+id+'">'+t(labelKey)+'</label><select id="'+id+'">'+o+'</select></div>';
  }
  function renderFilters(cur){
    cur = cur || {};
    fbox.innerHTML =
      dd('f-tipo','projects.f.type', tipos.map(function(x){ return {val:x, txt:tr('projects.type.'+x, x)}; }), cur.tipo) +
      dd('f-materia','projects.f.subject', materias.map(function(m){ return {val:keyOf(m), txt:pick(m)}; }), cur.materia) +
      dd('f-skill','projects.f.skill', skills.map(function(s){ return {val:keyOf(s), txt:pick(s)}; }), cur.skill) +
      '<button class="reset-btn" id="f-reset" type="button">'+t('projects.f.reset')+'</button>';
  }

  function render(){
    grid.innerHTML = PROYECTOS.map(function(p,i){
      var bar = barColors[i % barColors.length];
      var est = String(p.estado||'').trim().toLowerCase();
      if(!BADGE_CSS[est]) est = 'pronto';
      var nombre = pick(p.nombre);
      var pills = (p.habilidades||[]).map(function(s){ return '<span class="pill">'+pick(s)+'</span>'; }).join('');
      var misTipos = tiposDe(p);
      var tipoTxt  = misTipos.map(function(x){ return tr('projects.tag.'+x, x); }).join(' · ');
      var link = (p.repo && p.repo!=='#')
        ? '<a class="link" href="'+p.repo+'" target="_blank" rel="noopener">'+t('projects.repo')+'</a>'
        : '<span class="link" style="opacity:.6">'+t('projects.soon')+'</span>';
      var imgSrc = p.img ? (/^(https?:|\/|\.\.\/)/.test(p.img) ? p.img : '../'+p.img) : '';
      var thumb = p.img
        ? '<div class="proj-thumb"><img src="'+imgSrc+'" alt="'+nombre+'"></div>'
        : '<div class="proj-thumb"><span class="ph">'+t('projects.thumb.soon')+'</span></div>';
      return '<article class="win proj-card" data-tipo="'+misTipos.join('|')+'" data-materia="'+keyOf(p.materia)+'" data-skills="'+(p.habilidades||[]).map(keyOf).join('|')+'">'+
        '<div class="win-bar '+bar+'"><span class="win-title">'+nombre+'</span>'+
        '<span class="win-ctrls"><i>_</i><i>▢</i><i>✕</i></span></div>'+
        thumb +
        '<div class="mat-body">'+
        '<p class="meta">'+pick(p.periodo)+' · '+tipoTxt+'</p>'+
        '<h3 class="mat-name">'+nombre+'</h3>'+
        '<p style="font-size:.9rem;color:var(--text-soft);margin-bottom:10px">'+pick(p.descripcion)+'</p>'+
        '<p style="margin-bottom:10px">'+pills+'</p>'+
        '<p>'+link+' <span class="badge '+BADGE_CSS[est]+'">'+t('badge.'+est)+'</span></p>'+
        '</div></article>';
    }).join('');
  }

  var selTipo, selMat, selSkill;
  function applyFilter(){
    var ft = selTipo.value, fm = selMat.value, fs = selSkill.value;
    var cards = grid.querySelectorAll('.proj-card');
    var shown = 0;
    cards.forEach(function(c){
      var ok = (!ft || ('|'+c.dataset.tipo+'|').indexOf('|'+ft+'|')>=0) &&
               (!fm || c.dataset.materia===fm) &&
               (!fs || ('|'+c.dataset.skills+'|').indexOf('|'+fs+'|')>=0);
      c.classList.toggle('hide', !ok);
      if(ok) shown++;
    });
    var prev = grid.querySelector('.no-proj'); if(prev) prev.remove();
    if(shown===0){ var n=document.createElement('p'); n.className='no-proj'; n.textContent=t('projects.empty'); grid.appendChild(n); }
  }
  function wire(){
    selTipo  = document.getElementById('f-tipo');
    selMat   = document.getElementById('f-materia');
    selSkill = document.getElementById('f-skill');
    [selTipo,selMat,selSkill].forEach(function(s){ s.addEventListener('change', applyFilter); });
    document.getElementById('f-reset').addEventListener('click', function(){
      selTipo.value=''; selMat.value=''; selSkill.value=''; applyFilter();
    });
  }

  renderFilters(); render(); wire();

  /* cambio de idioma: se vuelve a dibujar todo, conservando los filtros elegidos */
  document.addEventListener('langchange', function(){
    var cur = { tipo:selTipo.value, materia:selMat.value, skill:selSkill.value };
    renderFilters(cur); render(); wire(); applyFilter();
  });
})();
</script>
