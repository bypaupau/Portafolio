<!-- idioma (ES/EN) + taskbar: van primero para que todo lo demás ya salga traducido -->
<script src="../js/translations.js?v=5"></script>

<script src="../data/proyectos.js?v=3"></script>
<script>
(function(){
  /* textos de la interfaz → js/translations.js · textos de cada materia → data/proyectos.js */
  var t = I18N.t, pick = I18N.pick;
  var BADGE_CSS = { 'completado':'bd-done', 'en-progreso':'bd-wip', 'pronto':'bd-soon' };
  var BAR = { pink:'', lav:'lav', mint:'mint', sky:'sky', peach:'peach' };
  var grid = document.getElementById('materias-grid');
  if(!grid || typeof MATERIAS==='undefined') return;

  function render(){
    grid.innerHTML = MATERIAS.map(function(m){
      var bar = BAR[m.color] || '';
      var items = m.proyectos.map(function(p){
        var est = BADGE_CSS[p.estado] ? p.estado : 'pronto';
        return '<li><a href="'+p.repo+'" class="proj-item" target="_blank" rel="noopener">'+pick(p.nombre)+
               '<span class="badge '+BADGE_CSS[est]+'">'+t('badge.'+est)+'</span></a></li>';
      }).join('');
      return '<article class="win">'+
        '<div class="win-bar '+bar+'"><span class="win-title">'+pick(m.periodo)+'</span>'+
        '<span class="win-ctrls"><i>_</i><i>▢</i><i>✕</i></span></div>'+
        '<div class="mat-body"><p class="mat-period">'+pick(m.periodo)+'</p>'+
        '<h3 class="mat-name">'+pick(m.nombre)+'</h3>'+
        '<ul class="proj-list">'+items+'</ul></div></article>';
    }).join('') +
    '<article class="win"><div class="win-bar peach"><span class="win-title">'+t('subjects.soon.bar')+'</span>'+
    '<span class="win-ctrls"><i>_</i><i>▢</i><i>✕</i></span></div>'+
    '<div class="mat-body"><p class="mat-period">'+t('subjects.soon.period')+'</p>'+
    '<h3 class="mat-name">'+t('subjects.soon.name')+'</h3>'+
    '<p style="font-size:.9rem;color:var(--text-soft)">'+t('subjects.soon.txt')+'</p>'+
    '</div></article>';
  }
  render();
  document.addEventListener('langchange', render);
})();
</script>
<script src="../js/portfolio.js?v=3"></script>
